[workspace]
members = ["crates/core", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
chromiumoxide = "0.9.1"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
futures = "0.3.34"
indicatif = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
